# ILLUSTRATIVE PLACEHOLDER — Section 3 Step 2, 2D describes CustomerSupport
# only as "real-time, latency-sensitive, customer-facing, medium risk
# tolerance"; the document gives no concrete threshold numbers for this
# profile anywhere. Only DecisionSupport.yaml's thresholds are a literal
# transcription of a document example (Section 5.1) — these values are
# NOT sourced from the document and are set only slightly more permissive
# than DecisionSupport's documented "low risk tolerance" numbers, matching
# this profile's described "medium risk tolerance".
#
# latency_budget_ms is the one doc-grounded value here: Section 3 Step 4
# states "5 s for CustomerSupport" explicitly.
use_case_id: CustomerSupport
geography: []
thresholds:
  block:
    data_leakage_risk: 9
    safety_risk: 9
    toxicity_risk: 9
  human_review:
    safety_risk: 8
    policy_violation_risk: 8
    hallucination_risk: 9
  modify:
    data_leakage_risk: 6
    pii_detected: true
  verify:
    hallucination_risk: 7
    correctness: 4
max_retries: 2
latency_budget_ms: 5000
require_human_review_for_final_block: false
# session_risk_window's default of 5 is doc-grounded (Section 6.1:
# "default N = 5"); session_risk_threshold is an illustrative placeholder
# (see CustomerSupport.yaml's header note), set higher than
# DecisionSupport's to match this profile's more permissive risk tolerance.
session_risk_window: 5
session_risk_threshold: 6.0
