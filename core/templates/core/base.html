{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}ControlPlane.ai Dashboard{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #0f1420; color: #e6e9ef; }
        nav { background: #161c2c; padding: 12px 24px; display: flex; gap: 20px; }
        nav a { color: #9fb3ff; text-decoration: none; font-size: 14px; }
        nav a.active { color: #fff; font-weight: 600; }
        main { padding: 24px; max-width: 1100px; margin: 0 auto; }
        .card { background: #161c2c; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .stat { font-size: 28px; font-weight: 700; }
        .label { font-size: 12px; color: #9aa4b8; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #232b3f; }
        form.inline { display: inline; }
        input, select, textarea, button { background: #0f1420; color: #e6e9ef; border: 1px solid #2a3348; border-radius: 4px; padding: 6px; }
        button { cursor: pointer; background: #3a5cff; border-color: #3a5cff; }
        .error { color: #ff6b6b; }
        .message { color: #6bffb0; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'dashboard-home' %}">Overview</a>
    <a href="{% url 'dashboard-trends' %}">Trends</a>
    <a href="{% url 'human-review-queue' %}">Human Review Queue</a>
    <a href="{% url 'fpr-tuning' %}">FPR Tuning</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
